name: Module C GCP validation
on:
  pull_request:
  push:
    branches: [main, feat/modulo-c-gcp-security]
permissions:
  contents: read
jobs:
  module-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/orders/requirements.txt
      - run: python -m unittest discover -s module-c/gcp -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/module_c -p 'test_*.py' -v
      - run: git diff --check
