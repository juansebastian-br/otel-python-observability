name: Module D sandbox validation
on:
  pull_request:
  push:
    branches: [main, feat/modulo-d-controlled-chaos]
permissions:
  contents: read
jobs:
  module-d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/orders/requirements.txt
      - run: python -m unittest discover -s tests/module_d -p 'test_*.py' -v
      - run: git diff --check
